# ============================================================
# 单目相机 → BEV（Yang Baseline）
# CVP/CVT 骨干，仅用伪 BEV 弱监督（λ_pseudo > 0，其余为 0）
# 参考: Yang et al. 2021 (Cycled View Projection + Cross-View Transformer)
# 区别: 无 BEV GT，用 Homography+Detection 生成的 pseudo_bev 替代
#
# 运行:  py scripts/train_bev.py --config configs/bev_yang.yaml
# ============================================================

mode: "yang"                  # 仅 pseudo 监督（其余权重被预设归零）
ablation: "a0"

homography:
  enabled: true
  mode: "planar_scale"
  pix_per_meter: 47.5
  origin_u: 1920.0
  origin_v: 2160.0

bev:
  x_min: -20.0
  x_max: 20.0
  y_min: -40.0
  y_max: 0.0
  resolution: 0.25

model:
  backbone: "resnet18"
  pretrained: true
  feature_dim: 256
  input_h: 480
  input_w: 640
  num_classes: 2
  bev_feature_h: 40
  bev_feature_w: 40
  cvp_hidden_dim: 256
  cvt_num_heads: 4
  cvt_num_layers: 1
  cvt_ff_dim: 512
  cvt_dropout: 0.1
  decoder_hidden_dim: 128

loss:
  pseudo_mode: "focal"
  focal_alpha: 0.25
  focal_gamma: 2.0
  dice_weight: 1.0
  cycle_dice_weight: 1.0
  pseudo_weight: null
  cvp_cycle_weight: null
  cycle_weight: null
  corr_weight: null
  temporal_weight: null

data:
  raw_video_dir: "D:/Red-Light视频数据/"
  bev:
    video_dir: "D:/Red-Light视频数据/"
    label_dir: "D:/Red-Light视频数据/labels/"
    img_h: 2160
    img_w: 3840
    input_h: 480
    input_w: 640
    mask_h: 480
    mask_w: 640
    sigma: 1.5
    normalize: true
    temporal: true
    split_ratio: [0.7, 0.15, 0.15]
    split_seed: 42

training:
  batch_size: 8
  learning_rate: 1e-4
  weight_decay: 1e-4
  epochs: 50
  gradient_clip: 1.0
  lr_scheduler: "cosine"
  warmup_epochs: 2
  seed: 42
  use_amp: true
  grad_accum_steps: 2
  grad_checkpointing: false
  num_workers: 0
  log_interval: 20
  eval_interval: 1
  checkpoint_dir: "checkpoints/bev/"
  log_dir: "logs/bev/"
  save_best: true
